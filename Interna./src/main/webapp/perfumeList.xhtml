<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <meta charset="utf-8" />
        <title>Lista perfum</title>
    </h:head>

    <h:body style="background-color: #eee; margin: 0.5em;">

        <p:panel header="Opcje wyszukiwania" toggleable="true" collapsed="true"
                 style="margin-bottom: 1em;">
            <h:form>
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel value="Marka:" />
                    <p:inputText value="#{perfumeListBB.brandName}" />
                    <p:commandButton value="Szukaj" update="form-table" />
                </h:panelGrid>
            </h:form>
        </p:panel>

        <p:messages />

        <h:form id="form-table" style="margin-bottom:1em;">

            <p:commandButton value="Dodaj nowy perfum" style="margin-bottom:1em;" 
                             action="#{perfumeListBB.newPerfume()}" />

            <p:dataTable value="#{perfumeListBB.list}" var="p">

                <p:column responsivePriority="5">
                    <f:facet name="header">
                        <h:outputText value="Marka" />
                    </f:facet>
                    <h:outputText value="#{p.brandName}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Nazwa perfum" />
                    </f:facet>
                    <h:outputText value="#{p.perfumeName}" />
                </p:column>

                <p:column responsivePriority="4">
                    <f:facet name="header">
                        <h:outputText value="Rok produkcji" />
                    </f:facet>
                    <h:outputText value="#{p.yearOfProduction}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Perfumiarz" />
                    </f:facet>
                    <h:outputText value="#{p.perfumer}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Opcje" />
                    </f:facet>

                    <p:commandButton value="Edytuj" style="margin-right: 0.5em"
                                     action="#{perfumeListBB.editPerfume(p)}" />

                    <p:commandButton value="Usuń" style="margin-right: 0.5em"
                                     action="#{perfumeListBB.deletePerfume(p)}"
                                     update="@form" />

                    <p:button outcome="perfumeEditGET" value="Edytuj (GET)">
                        <f:param name="p" value="#{p.id}" />
                    </p:button>
                </p:column>

            </p:dataTable>
        </h:form>

    </h:body>
</html>
